name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix develop -c pnpm install --frozen-lockfile
      - run: nix develop -c pnpm typecheck
      - run: nix develop -c pnpm test
